# MemHub — Docker Compose
# Starts the MemHub API server and (optionally) an Ollama LLM sidecar.
#
# Usage:
#   docker compose up -d              # start everything
#   docker compose up -d memhub       # server only (bring your own LLM)
#   docker compose logs -f memhub     # tail logs
#   docker compose down               # stop everything

services:
  # ── MemHub API Server ────────────────────────────────────────────────────
  memhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memhub-server
    restart: unless-stopped
    ports:
      - "${MEMHUB_PORT:-8000}:8000"
    volumes:
      # Persist SQLite + ChromaDB across container restarts
      - memhub-data:/data
    environment:
      - MEMHUB_DB_PATH=/data/memhub.db
      - MEMHUB_CHROMA_PATH=/data/chroma_db
      - MEMHUB_DISABLE_AUTH=${MEMHUB_DISABLE_AUTH:-0}
      - MEMHUB_CORS_ORIGINS=${MEMHUB_CORS_ORIGINS:-*}
      - WORKERS=${WORKERS:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Point summarisation at the Ollama sidecar
      - MEMHUB_LLM_BASE_URL=http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_started
    networks:
      - memhub-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Ollama LLM Sidecar ──────────────────────────────────────────────────
  # Provides the local OpenAI-compatible endpoint for memory summarisation.
  # Remove this service if you're running Ollama on the host or using a
  # cloud LLM endpoint — just set MEMHUB_LLM_BASE_URL accordingly.
  ollama:
    image: ollama/ollama:latest
    container_name: memhub-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Persist downloaded models across restarts
      - ollama-models:/root/.ollama
    networks:
      - memhub-net
    # Uncomment below to enable GPU passthrough (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  memhub-data:
    driver: local
  ollama-models:
    driver: local

networks:
  memhub-net:
    driver: bridge
